<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NBA Stats Analyzer{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-dribbble"></i> NBA Stats Analyzer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-3">
                    <li class="nav-item">
                        <a class="nav-link {% block nav_stats %}{% endblock %}" href="/">
                            <i class="bi bi-bar-chart-line"></i> Player Stats
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_rankings %}{% endblock %}" href="/rankings">
                            <i class="bi bi-trophy"></i> Custom Rankings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_compare %}{% endblock %}" href="/compare">
                            <i class="bi bi-people"></i> Compare Players
                        </a>
                    </li>
                </ul>
                <span class="by-tag d-none d-lg-inline">by Nathan Agustin</span>
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-brand"><i class="bi bi-dribbble"></i> NBA Stats Analyzer</span>
                <div class="footer-links">
                    <a href="/">Player Stats</a>
                    <a href="/rankings">Rankings</a>
                    <a href="/compare">Compare</a>
                </div>
            </div>
            <p class="footer-copy">&copy; 2026 Nathan Agustin &middot; Built with Flask &amp; NBA API</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
